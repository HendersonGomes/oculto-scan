name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,macro]"
      - name: Lint
        run: python -m ruff check src tests packaging
      - name: Test
        run: python -m pytest

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install auditor
        run: python -m pip install pip-audit
      - name: Audit runtime dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          deps = list(data["project"]["dependencies"])
          deps.extend(data["project"]["optional-dependencies"]["macro"])
          deps.extend(data["project"]["optional-dependencies"]["package"])
          Path("runtime-reqs.txt").write_text("\n".join(deps) + "\n", encoding="utf-8")
          PY
          python -m pip_audit --requirement runtime-reqs.txt

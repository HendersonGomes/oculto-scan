# Build do .exe no runner hospedado pelo GitHub.
# Sem actions/cache e sem cache do pip: a origem fica só nos arquivos versionados
# (requisito de origem verificada da SignPath). A assinatura continua desligada.

name: Windows exe

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  exe:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --no-cache-dir -e ".[macro,package]"
      - name: Version resource
        run: python packaging/write_version_info.py
      - name: Build
        # UPX fica desligado no .spec (upx=False). A flag --noupx não vale junto com um .spec.
        run: python -m PyInstaller --noconfirm --clean packaging/oculto-scan.spec
      - name: Smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = (python -c "import oculto_scan; print('oculto-scan ' + oculto_scan.__version__)").Trim()
          $version = .\dist\oculto-scan.exe --version | Out-String
          if ($version -notmatch [regex]::Escape($expected)) {
            Write-Error "version [$version] esperada [$expected]"
            exit 1
          }
          $check = .\dist\oculto-scan.exe --self-check | Out-String
          if ($check -notmatch "(?m)^ok\s*$") {
            Write-Error "self-check [$check]"
            exit 1
          }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = "79b7a1063b3888bb8eceb44a8c28e90ccdaa22ac71f9272de1dac79b42941dbd"
          $dest = Join-Path $env:TEMP "innosetup-6.5.0.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_5_0/innosetup-6.5.0.exe" -OutFile $dest
          $hash = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLower()
          if ($hash -ne $expected) {
            Write-Error "Inno Setup hash [$hash]"
            exit 1
          }
          Start-Process -FilePath $dest -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
      - name: Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (python -c "import oculto_scan; print(oculto_scan.__version__)").Trim()
          $parts = @($version.Split("."))
          while ($parts.Count -lt 4) { $parts += "0" }
          $quad = ($parts[0..3] -join ".")
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Error "ISCC nao encontrado"
            exit 1
          }
          & $iscc "/DMyAppVersion=$version" "/DMyAppVersionQuad=$quad" "packaging\oculto-scan.iss"
          if (-not (Test-Path .\dist\oculto-scan-setup.exe)) {
            Write-Error "instalador ausente"
            exit 1
          }
      - name: Checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("oculto-scan.exe", "oculto-scan-setup.exe")) {
            $item = Get-Item ".\dist\$name"
            $hash = (Get-FileHash -Algorithm SHA256 $item).Hash.ToLower()
            Set-Content -Path ".\dist\$name.sha256" -Value "$hash  $name" -Encoding ascii
            Write-Host "SHA-256 $name $hash"
            Write-Host "bytes $($item.Length)"
          }
      - name: Upload unsigned exe
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oculto-scan-windows
          if-no-files-found: error
          path: |
            dist/oculto-scan.exe
            dist/oculto-scan.exe.sha256
            dist/oculto-scan-setup.exe
            dist/oculto-scan-setup.exe.sha256

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: oculto-scan-windows
          path: dist
      - name: Publish unsigned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          hash=$(cut -d' ' -f1 dist/oculto-scan.exe.sha256)
          setup=$(cut -d' ' -f1 dist/oculto-scan-setup.exe.sha256)
          {
            cat packaging/release-notes.md
            printf '\nSHA-256 oculto-scan.exe: %s\n' "$hash"
            printf 'SHA-256 oculto-scan-setup.exe: %s\n' "$setup"
          } > release-body.md
          gh release create "$tag" \
            dist/oculto-scan.exe dist/oculto-scan.exe.sha256 \
            dist/oculto-scan-setup.exe dist/oculto-scan-setup.exe.sha256 \
            --title "oculto-scan $tag" \
            --notes-file release-body.md \
            --latest

      # Assinatura SignPath ainda DESLIGADA. O .exe e o instalador NÃO são assinados.
      # Ative o passo quando existirem SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID
      # e os slugs do projeto e da política. O artefato oculto-scan-windows traz os
      # dois arquivos (oculto-scan.exe e oculto-scan-setup.exe); o pedido deve
      # assinar os dois. Ele precisa continuar vindo de actions/upload-artifact v4
      # ou mais novo, no job exe deste workflow.

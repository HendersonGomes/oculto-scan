# Build do .exe no runner hospedado pelo GitHub.
# Sem actions/cache e sem cache do pip: a origem fica só nos arquivos versionados
# (requisito de origem verificada da SignPath). A assinatura continua desligada.

name: Windows exe

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  exe:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --no-cache-dir -e ".[macro,package]"
      - name: Version resource
        run: python packaging/write_version_info.py
      - name: Build
        run: python -m PyInstaller --noconfirm --clean packaging/oculto-scan.spec
      - name: Smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = (python -c "import oculto_scan; print('oculto-scan ' + oculto_scan.__version__)").Trim()
          $version = .\dist\oculto-scan.exe --version | Out-String
          if ($version -notmatch [regex]::Escape($expected)) {
            Write-Error "version [$version] esperada [$expected]"
            exit 1
          }
          $check = .\dist\oculto-scan.exe --self-check | Out-String
          if ($check -notmatch "(?m)^ok\s*$") {
            Write-Error "self-check [$check]"
            exit 1
          }
      - name: Checksum
        shell: pwsh
        run: |
          $item = Get-Item .\dist\oculto-scan.exe
          $hash = (Get-FileHash -Algorithm SHA256 $item).Hash.ToLower()
          Set-Content -Path .\dist\oculto-scan.exe.sha256 -Value "$hash  oculto-scan.exe" -Encoding ascii
          Write-Host "SHA-256 $hash"
          Write-Host "bytes $($item.Length)"
      - name: Upload unsigned exe
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oculto-scan-windows
          if-no-files-found: error
          path: |
            dist/oculto-scan.exe
            dist/oculto-scan.exe.sha256

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: oculto-scan-windows
          path: dist
      - name: Publish unsigned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          hash=$(cut -d' ' -f1 dist/oculto-scan.exe.sha256)
          {
            cat packaging/release-notes.md
            printf '\nSHA-256: %s\n' "$hash"
          } > release-body.md
          gh release create "$tag" dist/oculto-scan.exe dist/oculto-scan.exe.sha256 \
            --title "oculto-scan $tag" \
            --notes-file release-body.md

      # Assinatura SignPath ainda DESLIGADA. O .exe desta release NÃO é assinado.
      # Ative o passo quando existirem SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID
      # e os slugs do projeto e da política. O artefato precisa continuar vindo de
      # actions/upload-artifact v4 ou mais novo, no job exe deste workflow.
